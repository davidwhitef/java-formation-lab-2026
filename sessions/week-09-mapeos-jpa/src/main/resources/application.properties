spring.application.name=jpa-mapeos

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:retail;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate genera el esquema a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sin Open Session In View: el contexto de persistencia vive solo dentro de la transacción
spring.jpa.open-in-view=false
